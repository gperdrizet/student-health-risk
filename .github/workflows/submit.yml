# Work on dev branch -> PR (tests) -> Merge to main -> Submit submission.csv 
name: Submit to Kaggle

# Event trigger for the workflow
on:

  # Trigger manually via GitHub Actions UI with inputs for version and confirmation
  workflow_dispatch:
    inputs:
      version:
        description: "Version to create and submit (e.g. 1.2.3)"
        required: true
      confirm:
        description: "Type 'submit' to confirm submission"
        required: true
        default: ""

# List of jobs to run - we only have one job for submitting predictions
jobs:

  # A guard job to ensure the user has confirmed the submission
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "submit" ]; then
            echo "Confirmation string must be 'submit'. Got: ${{ github.event.inputs.confirm }}"
            exit 1
          fi

  # The job responsible for submitting predictions to Kaggle
  submit_predictions:
    name: Submit predictions

    # Check that we have cleared submission guard
    needs: guard

    # Define the environment for the job - in this case, it runs on an Ubuntu machine
    runs-on: ubuntu-latest

    # Only run this job if the pull request was merged or if manually triggered
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    # Sequence of steps to submit predictions
    steps:

    # Checkout code from the repo
    - name: Checkout
      uses: actions/checkout@v7

    # Setup Python
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    # Copy the submission CSV file with version number
    - name: Version submission CSV
      run: |
        cp data/submission.csv data/submission_v${{ github.event.inputs.version }}.csv

    # Commit new submission CSV with version number
    - name: Commit new submission CSV
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/submission_v${{ github.event.inputs.version }}.csv
        git commit -m "Update submission.csv to version ${{ github.event.inputs.version }}"

    # Install Kaggle CLI
    - name: Install Kaggle CLI

      # Run the command to install the Kaggle CLI
      run: pip install --no-cache-dir kaggle

    # Get release body from corresponding GitHub release version for submission message
    - name: Get release body for submission message

      # Set environment variable for GitHub token to authenticate with GitHub CLI
      env:
        GH_TOKEN: ${{ github.token }}

      # Set an output variable to store the PR body for later use
      id: pr_body

      run: |
        # Fetch the release body using GitHub CLI
        release_body=$(gh release view ${{ github.event.inputs.version }} --json body --jq '.body')
        echo "Release Body: $release_body"
        # Set the release body as an output variable for later use
        echo "release_body=$release_body" >> $GITHUB_OUTPUT

    # Submit predictions CSV
    - name: Submit to competition

      # Set environment variables for Kaggle authentication
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

      # Run the Kaggle submission command
      run: |
        kaggle competitions submit \
          -c playground-series-s6e7 \
          -f data/submission_v${{ github.event.inputs.version }}.csv \
          -m "Submission from PR #${{ github.event.pull_request.number }}: ${{ steps.pr_body.outputs.release_body }}"