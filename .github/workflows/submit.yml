name: Submit to Kaggle

# Runs the following steps when a new version tag is pushed to the repository
# 1. Creates GitHub Release from tag version number
# 2. Creates a version tagged submission file from current contents of data/submission.csv
# 3. Adds the version tagged submission file to the release
# 4. Submits the version tagged submission file to the Kaggle competition
# 5. Updates the leaderboard rank badge in the README file

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  submit_predictions:
    name: Submit test set predictions
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Set Version Environment Variable
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

    # Creates the GitHub Release using your .github/release.yml prefix rules
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ env.RELEASE_VERSION }} --generate-notes

    # Create version tagged submission file
    - name: Version submission CSV
      run: |
        cp data/submission.csv data/submission.${{ env.RELEASE_VERSION }}.csv

    # Upload file asset to the online release page
    - name: Upload submission file to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload ${{ env.RELEASE_VERSION }} data/submission.${{ env.RELEASE_VERSION }}.csv --clobber

    # Gather the dynamic release notes text
    - name: Get release body for submission message
      id: release_body
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        release_body=$(gh release view ${{ env.RELEASE_VERSION }} --json body --jq '.body')
        
        # If the body only contains the default hidden GitHub HTML comment, reset it
        if [[ "$release_body" == *"<!--"* ]]; then
          release_body="Routine model submission for version ${{ env.RELEASE_VERSION }}."
        fi
        
        echo "release_body<<EOF" >> $GITHUB_OUTPUT
        echo "$release_body" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    # Install Kaggle CLI to up load submission
    - name: Install Kaggle CLI
      run: pip install --no-cache-dir kaggle

    # Send the final payload to Kaggle
    - name: Submit to competition
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      run: |
        kaggle competitions submit \
          -c playground-series-s6e7 \
          -f data/submission.${{ env.RELEASE_VERSION }}.csv \
          -m "Submission Version ${{ env.RELEASE_VERSION }}: ${{ steps.release_body.outputs.release_body }}"

    # Install Pandas for use in rank verification
    - name: Install Pandas
      run: pip install --no-cache-dir pandas

    # Wait for evaluation loop, pull the new rank, and update README
    - name: Fetch Kaggle Rank and Update Badge
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      run: |
        COMP_ID="playground-series-s6e7"
        echo "Waiting for Kaggle to score the new submission..."
        
        # Monitor the submission using a resilient inline Python verification loop
        python -c "
        import subprocess, time, io, pandas as pd
        
        while True:
            # 1. Safely run the command and stream text directly to a data frame
            result = subprocess.run(['kaggle', 'competitions', 'submissions', '-c', '$COMP_ID', '--csv'], capture_output=True, text=True)
            df = pd.read_csv(io.StringIO(result.stdout))
            
            # 2. Extract the first row's 'status' column accurately
            current_status = str(df['status'].iloc[0]).strip()
            
            if current_status == 'complete':
                print('Submission scoring complete!')
                break
            elif current_status in ['error', 'failed']:
                print('Error: Kaggle scoring failed.')
                exit(1)
            else:
                print(f'Status is currently: {current_status}. Checking again in 15 seconds...')
                time.sleep(15)
        "

        # 3. Fetch the public leaderboard position
        sleep 5
        RANK_DATA=$(kaggle competitions list --group entered --csv)
        MY_RANK=$(echo "$RANK_DATA" | grep "$COMP_ID" | cut -d',' -f7 | tr -d '[:space:]')
        
        if [ -z "$MY_RANK" ] || [ "$MY_RANK" == "0" ]; then
          MY_RANK="Pending"
        fi
        
        BADGE_MARKDOWN="![Kaggle Rank](https://shields.io/badge/Kaggle-Rank%20${MY_RANK}-blue?logo=kaggle&logoColor=white)"
        
        python -c "
        import re
        with open('README.md', 'r') as f:
            content = f.read()
        pattern = r'(<!-- KAGGLE_BADGE_START -->)(.*?)(<!-- KAGGLE_BADGE_END -->)'
        replacement = f'\\\\1\\\\n{BADGE_MARKDOWN}\\\\n\\\\3'
        with open('README.md', 'w') as f:
            f.write(re.sub(pattern, replacement, content, flags=re.DOTALL))
        "
        
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md
        git commit -m "chore: automated update of leaderboard rank badge to ${MY_RANK} [skip ci]" || echo "No change in rank."
        git push origin main
