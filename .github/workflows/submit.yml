name: Submit to Kaggle

# Trigger automatically whenever a release is published on GitHub
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  submit_predictions:
    name: Submit predictions
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    # Uses the actual tag name from the release (e.g., v0.1.0 or 0.1.0)
    # replaces 'refs/tags/' from the github.ref variable
    - name: Set Version Environment Variable
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

    # Copy the submission CSV file using the dynamic version name
    - name: Version submission CSV
      run: |
        cp data/submission.csv data/submission.${{ env.RELEASE_VERSION }}.csv

    # Add the versioned submission file back onto the release assets list
    - name: Upload submission file to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload ${{ env.RELEASE_VERSION }} data/submission.${{ env.RELEASE_VERSION }}.csv --clobber

    # Extracts the exact release notes markdown directly from the trigger payload
    - name: Get release body for submission message
      id: release_body
      run: |
        # Use a heredoc to safely store multi-line text into outputs
        echo "release_body<<EOF" >> $GITHUB_OUTPUT
        echo "${{ github.event.release.body }}" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Install Kaggle CLI
      run: pip install --no-cache-dir kaggle

    # Submit predictions CSV to Kaggle
    - name: Submit to competition
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      run: |
        kaggle competitions submit \
          -c playground-series-s6e7 \
          -f data/submission.${{ env.RELEASE_VERSION }}.csv \
          -m "Submission Version ${{ env.RELEASE_VERSION }}: ${{ steps.release_body.outputs.release_body }}"
