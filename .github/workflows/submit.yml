name: Submit to Kaggle

# Runs the following steps when a new version tag is pushed to the repository
# 1. Creates GitHub Release from tag version number
# 2. Creates a version tagged submission file from current contents of data/submission.csv
# 3. Adds the version tagged submission file to the release
# 4. Submits the version tagged submission file to the Kaggle competition
# 5. Updates the leaderboard rank badge in the README file

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  submit_predictions:
    name: Submit test set predictions
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Set Version Environment Variable
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Install release note dependencies
      run: pip install --no-cache-dir pyyaml

    - name: Generate release notes
      run: |
        python scripts/generate_release_notes.py \
          --config .github/release.yml \
          --tag "${{ env.RELEASE_VERSION }}" \
          --output release_notes.md

    # Creates the GitHub Release using your .github/release.yml prefix rules
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ env.RELEASE_VERSION }} --notes-file release_notes.md

    # Create version tagged submission file
    - name: Version submission CSV
      run: |
        cp data/submission.csv data/submission.${{ env.RELEASE_VERSION }}.csv

    # Upload file asset to the online release page
    - name: Upload submission file to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload ${{ env.RELEASE_VERSION }} data/submission.${{ env.RELEASE_VERSION }}.csv --clobber

    # Gather the dynamic release notes text
    - name: Get release body for submission message
      id: release_body
      run: |
        release_body=$(cat release_notes.md)
        echo "release_body<<EOF" >> $GITHUB_OUTPUT
        echo "$release_body" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    # Install Kaggle CLI to up load submission
    - name: Install Kaggle CLI
      run: pip install --no-cache-dir kaggle

    # Send the final payload to Kaggle
    - name: Submit to competition
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      run: |
        kaggle competitions submit \
          -c playground-series-s6e7 \
          -f data/submission.${{ env.RELEASE_VERSION }}.csv \
          -m "Submission Version ${{ env.RELEASE_VERSION }}: ${{ steps.release_body.outputs.release_body }}"

    # Install the Python packages needed for leaderboard parsing and plotting
    - name: Install Leaderboard Plotting Dependencies
      run: pip install --no-cache-dir kaggle pandas matplotlib numpy

    # Wait for Kaggle to score the submission, then update the README badge and plot
    - name: Fetch Kaggle Rank and Update Badge
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        COMP_ID: "playground-series-s6e7" # Pass it down as a real environment variable
      run: |
        echo "Waiting for Kaggle to score the new submission..."
        python scripts/update_kaggle_badge.py
        
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md docs/kaggle-leaderboard-rank.png
        git commit -m "chore: automated update of leaderboard rank badge [skip ci]" || echo "No change in rank."
        git push origin main
